<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Variant 1 — Tree Lines</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #f0f4f8; display: flex; align-items: flex-start; justify-content: center; padding-top: 32px; font-family: system-ui, sans-serif; }
  .sidebar { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); width: 240px; overflow: hidden; }
  .header { background: #dbeafe; padding: 10px 16px; font-weight: 700; font-size: 15px; color: #1e3a5f; }
  .tree { padding: 10px 12px; }
  .parent-row { display: flex; align-items: stretch; margin-bottom: 2px; }
  .v-line-wrap { width: 20px; display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; }
  .v-line { position: absolute; left: 9px; top: 0; bottom: 0; width: 1px; background: #cbd5e1; }
  .v-line.top-half { top: 50%; }
  .v-line.bottom-half { bottom: 50%; }
  .h-line { position: absolute; left: 9px; top: 50%; width: 10px; height: 1px; background: #cbd5e1; }
  .parent-label { flex: 1; background: #dcfce7; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: #166534; cursor: pointer; margin: 2px 0; }
  .parent-label:hover { background: #bbf7d0; }
  .children { padding-left: 20px; }
  .child-row { display: flex; align-items: stretch; margin-bottom: 2px; }
  .child-label { flex: 1; background: #fee2e2; border-radius: 10px; padding: 5px 12px; font-size: 12px; font-weight: 500; color: #991b1b; cursor: pointer; margin: 2px 0; }
  .child-label:hover { background: #fecaca; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="header">Project</div>
  <div class="tree">

    <!-- ABC -->
    <div class="parent-row">
      <div class="v-line-wrap">
        <div class="v-line top-half"></div>
        <div class="h-line"></div>
      </div>
      <div class="parent-label">ABC</div>
    </div>
    <div class="children">
      <div class="child-row">
        <div class="v-line-wrap">
          <div class="v-line"></div>
          <div class="h-line"></div>
        </div>
        <div class="child-label">AAA</div>
      </div>
      <div class="child-row">
        <div class="v-line-wrap">
          <div class="v-line"></div>
          <div class="h-line"></div>
        </div>
        <div class="child-label">BBB</div>
      </div>
      <div class="child-row">
        <div class="v-line-wrap">
          <div class="v-line bottom-half"></div>
          <div class="h-line"></div>
        </div>
        <div class="child-label">CCC</div>
      </div>
    </div>

    <!-- DEF -->
    <div class="parent-row">
      <div class="v-line-wrap">
        <div class="v-line"></div>
        <div class="h-line"></div>
      </div>
      <div class="parent-label">DEF</div>
    </div>
    <div class="children">
      <div class="child-row">
        <div class="v-line-wrap">
          <div class="v-line bottom-half"></div>
          <div class="h-line"></div>
        </div>
        <div class="child-label">AAA</div>
      </div>
    </div>

    <!-- IJKLM -->
    <div class="parent-row">
      <div class="v-line-wrap">
        <div class="v-line bottom-half"></div>
        <div class="h-line"></div>
      </div>
      <div class="parent-label">IJKLM</div>
    </div>

  </div>
</div>
</body>
</html>
