kind = "web"
previewPath = "/"
title = "Notebook App"
version = "1.0.0"
id = "artifacts/notebook"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21990

[services.development]
run = "pnpm --filter @workspace/notebook run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notebook", "run", "build" ]
publicDir = "artifacts/notebook/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21990"
BASE_PATH = "/"
